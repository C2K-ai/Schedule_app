<title>Dream Diary Intro</title>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   Diary intro — every selector is scoped under .di so it can live in the app.
   All motion is driven from JS (render(t) is a pure function of time); the only
   CSS animation is the end-state caret blink (paused while seeking).
   ═══════════════════════════════════════════════════════════════════════════ */
html, body { margin: 0; height: 100%; background: #0b0920; overflow: hidden; }
body > .di { position: fixed; inset: 0; }

.di {
  /* theme tokens (dusk) — swap for the app's tokens */

  --di-gold-hi: #fff3cc; --di-gold: #e6c174; --di-gold-mid: #c4963f; --di-gold-lo: #7c581c;
  --di-endpaper: #1a1c55; --di-endpaper-lo: #0f1139;
  --di-paper-1: #fdf9f0; --di-paper-2: #f4ead5;

  --di-accent: #e2834a;

  --di-shadow: 6, 4, 22;

  --di-sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "WenQuanYi Zen Hei", system-ui, sans-serif;

  position: relative; overflow: hidden; contain: strict; isolation: isolate;
  background: var(--di-bg-2);
  font-family: var(--di-sans);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none; touch-action: manipulation; cursor: pointer;
}
.di.is-done { cursor: auto; }
.di *, .di *::before, .di *::after { box-sizing: border-box; }
.di i, .di b { display: block; font-style: normal; }

/* stage = everything that disappears at the end (display:none → nothing stays composited) */

  --notch: calc(var(--rw) * 0.6);
  -webkit-mask: linear-gradient(#000, #000) top / 100% calc(100% - var(--notch) + 1px) no-repeat,

.di-cin { background: var(--di-cover-lo); border-radius: 6px 2px 2px 6px; }

<div id="diary-intro" role="img" aria-label="일기장이 열리는 애니메이션 (탭하면 건너뜀)"></div>

<script>
(() => {
'use strict';

/* ═══════════════════════════ Timeline (ms) — visuals and sound read the same table ═══════════════════════════ */
const TL = Object.freeze({
  veil: [0, 220], veilFrom: 0.16,  // a light veil only: frame 0 already shows the book and the sheen
  sheen: [0, 820],                 // sheen starts on the cover at t=0 and sweeps across
  cover: [170, 830],               // cover swing (lands at 830, small rebound after)
  pan: [300, 1020],                // camera slides to the spine, tilts lower, straightens the yaw
  burst: [650, 1080], flash: 960,  // light shafts shoot up
  riffle: [600, 1560], leaves: 10, // pages flutter (accelerate, then decelerate)
  lift: [1440, 1940],              // right page rises, camera flattens onto it (ends 1:1 with the sheet)
  sheet: [1880, 2270],             // the sheet (same pixels, overlapping the camera's last 2px of settle) opens out
  lightOut: [1880, 2380],
  text: [2110, 2400],
  end: 2420,
  reducedEnd: 420,
});
const STRIPS = 10, LEAF_CURL = 56, LEAF_BOW = 34, ASPECT = 0.72;
const TH_C = 38, TH_O = 48, YAW_C = -7;

/* ═══════════════════════════ Helpers ═══════════════════════════ */
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const ramp = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const expLerp = (a, b, p) => Math.exp(lerp(Math.log(a), Math.log(b), p));
const smooth = (p) => p * p * (3 - 2 * p);
const inOutCubic = (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const outCubic = (p) => 1 - Math.pow(1 - p, 3);
const outQuart = (p) => 1 - Math.pow(1 - p, 4);
const inOutSine = (p) => -(Math.cos(Math.PI * p) - 1) / 2;
const outSine = (p) => Math.sin((p * Math.PI) / 2);
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

const f2 = (v) => (Math.round(v * 100) / 100);
const svgUrl = (s) => `url("data:image/svg+xml,${encodeURIComponent(s)}")`;

/* leaf schedule: gaps shrink in the middle (accelerate, then decelerate) — shared with the sound */
const LEAF = (() => {
  const n = TL.leaves, [a, b] = TL.riffle, durs = [], w = [];
  for (let i = 0; i < n; i++) { const m = Math.sin(Math.PI * (i + 0.5) / n); durs.push(430 - 150 * m); w.push(1 - 0.62 * m); }
  const cum = [0];
  for (let i = 1; i < n; i++) cum.push(cum[i - 1] + (w[i - 1] + w[i]) / 2);
  const span = b - a - durs[n - 1];
  return { n, starts: cum.map((c) => a + (c / cum[n - 1]) * span), durs };
})();

function playIntroSound(ctx, opts = {}) {
  const o = Object.assign({ volume: 0.55, minimal: false, muted: false }, opts);
  const T0 = ctx.currentTime + 0.03, at = (ms) => T0 + ms / 1000;
  const R = mulberry32(4242), nodes = [];
  const master = ctx.createGain(); master.gain.value = o.muted ? 0 : o.volume;
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 3.5; comp.attack.value = 0.003; comp.release.value = 0.22;
  master.connect(comp); comp.connect(ctx.destination);
  const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 2), ctx.sampleRate);
  { const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; }
  const noise = (when, dur, offset = 0) => { const s = ctx.createBufferSource(); s.buffer = buf; s.start(when, offset % 1.5, dur); nodes.push(s); return s; };
  const osc = (type, f, when, dur) => { const n = ctx.createOscillator(); n.type = type; n.frequency.value = f; n.start(when); n.stop(when + dur); nodes.push(n); return n; };
  const filt = (type, f, q = 0.7) => { const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q; return n; };
  const env = (when, peak, a, d) => { const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, when); g.gain.exponentialRampToValueAtTime(peak, when + a); g.gain.exponentialRampToValueAtTime(0.0001, when + a + d); return g; };
  const chain = (...n) => { for (let i = 0; i < n.length - 1; i++) n[i].connect(n[i + 1]); return n[n.length - 1]; };
  const panner = (v) => { if (!ctx.createStereoPanner) return null; const p = ctx.createStereoPanner(); p.pan.value = v; return p; };
  // small room for the bells
  const room = ctx.createDelay(1); room.delayTime.value = 0.15;
  const fb = ctx.createGain(); fb.gain.value = 0.36;
  const wet = ctx.createGain(); wet.gain.value = 0.45;
  const tone = filt('lowpass', 5600, 0.5);
  chain(room, tone, fb, room); tone.connect(wet); wet.connect(master);
  const bell = (f, when, peak, dur, pan = 0) => {
    const p = panner(pan);
    for (const [mul, amp] of [[1, 1], [2.76, 0.22], [5.4, 0.06]]) {
      const g = env(when, peak * amp, 0.008, dur * (mul === 1 ? 1 : 0.5));
      chain(osc('sine', f * mul, when, dur + 0.1), g);
      if (p) { g.connect(p); } else { g.connect(master); g.connect(room); }
    }
    if (p) { p.connect(master); p.connect(room); }
  };

  if (o.minimal) {
    // reduced motion: just a soft three-note chime
    [1318.5, 1975.5, 2637.0].forEach((f, i) => bell(f, at(40 + i * 85), 0.032, 1.3, (i - 1) * 0.2));
  } else {
    const coverLand = TL.cover[1];
    // 1 · leather/air swish while the cover swings
    { const t0 = at(TL.cover[0]), t1 = at(coverLand);
      const bp = filt('bandpass', 320, 0.8); bp.frequency.setValueAtTime(320, t0); bp.frequency.exponentialRampToValueAtTime(1500, t1);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.075, t0 + (t1 - t0) * 0.75); g.gain.exponentialRampToValueAtTime(0.0001, t1 + 0.05);
      chain(noise(t0, t1 - t0 + 0.08, 0.3), bp, g, master); }
    // 2 · soft thump as it lands
    { const t = at(coverLand);
      const n = osc('sine', 118, t, 0.42); n.frequency.setValueAtTime(118, t); n.frequency.exponentialRampToValueAtTime(44, t + 0.2);
      chain(n, env(t, 0.72, 0.005, 0.3), master);
      chain(noise(t, 0.14, 0.9), filt('lowpass', 520, 0.7), env(t, 0.34, 0.002, 0.1), master); }
    // 3 · paper riffle: ticks follow the leaf schedule, panned right → left as the pages cross
    LEAF.starts.forEach((s, i) => {
      const pan = lerp(0.32, -0.32, i / (LEAF.n - 1));
      for (const [frac, amp] of [[0.12, 0.12], [0.5, 0.22], [0.86, 0.16]]) {
        const when = at(s + LEAF.durs[i] * frac + (R() - 0.5) * 12);
        const p = panner(pan + (frac - 0.5) * 0.25);
        const g = env(when, amp * (0.8 + R() * 0.4) * (0.55 + 0.45 * Math.sin(Math.PI * (i + 0.5) / LEAF.n)), 0.0025, 0.022 + R() * 0.03);
        const tail = chain(noise(when, 0.08, R() * 1.4), filt('bandpass', 2200 + R() * 2800, 0.9 + R() * 0.5), g);
        if (p) chain(tail, p, master); else tail.connect(master);
      }
    });
    { const s0 = at(TL.riffle[0]), s1 = at(TL.riffle[1]);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, s0); g.gain.exponentialRampToValueAtTime(0.03, (s0 + s1) / 2); g.gain.exponentialRampToValueAtTime(0.0001, s1);
      chain(noise(s0, s1 - s0 + 0.05, 0.5), filt('highpass', 2400, 0.6), g, master); }
    // 4 · shimmer as the light appears: bell arpeggio + warm pad + glitter air
    { const ts = at(TL.burst[0] + 30);
      [1318.5, 1661.2, 1975.5, 2489.0, 2637.0, 3322.4, 3951.1].forEach((f, i) => bell(f, ts + i * 0.062 + R() * 0.01, 0.026 * (1 - i * 0.07), 1.35 - i * 0.06, lerp(-0.3, 0.3, i / 6)));
      [329.6, 493.9].forEach((f) => { const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, ts); g.gain.exponentialRampToValueAtTime(0.03, ts + 0.35); g.gain.exponentialRampToValueAtTime(0.0001, ts + 1.8);
        chain(osc('triangle', f, ts, 1.9), filt('lowpass', 1400), g, master); });
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, ts); g.gain.exponentialRampToValueAtTime(0.028, ts + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, ts + 1.4);
      chain(noise(ts, 1.5, 0.2), filt('highpass', 6800, 0.6), g, master); }
    // 5 · the page lifts: an airy swoosh, then a soft landing chime as the date appears
    { const t0 = at(TL.lift[0] + 60), t1 = at(TL.sheet[1]);
      const bp = filt('bandpass', 700, 0.6); bp.frequency.setValueAtTime(700, t0); bp.frequency.exponentialRampToValueAtTime(2600, t1);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.045, t0 + (t1 - t0) * 0.55); g.gain.exponentialRampToValueAtTime(0.0001, t1);
      chain(noise(t0, t1 - t0 + 0.05, 0.7), bp, g, master);
      bell(1975.5, at(TL.text[0]), 0.018, 1.1, 0.1); bell(2637.0, at(TL.text[0] + 70), 0.012, 1.0, -0.1); }
  }
  let stopped = false;
  return {
    stop(fade = 0.12) {
      if (stopped) return; stopped = true;
      try { const now = ctx.currentTime; master.gain.cancelScheduledValues(now); master.gain.setValueAtTime(master.gain.value, now); master.gain.linearRampToValueAtTime(0, now + fade); } catch (e) {}
      setTimeout(() => { for (const n of nodes) { try { n.stop(); } catch (e) {} } try { master.disconnect(); wet.disconnect(); } catch (e) {} }, fade * 1000 + 80);
    },
    setMuted(m) { try { master.gain.setTargetAtTime(m ? 0 : o.volume, ctx.currentTime, 0.03); } catch (e) {} },
  };
}

function makeLeather(size = 192) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size), d = img.data;
  const R = mulberry32(77), n = 26, pts = [];
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) pts.push([0.15 + R() * 0.7, 0.15 + R() * 0.7, R()]);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = (x / size) * n, v = (y / size) * n, ci = Math.floor(u), cj = Math.floor(v);
    let f1 = 9, f2_ = 9, shade = 0;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      const i = ci + di, j = cj + dj, p = pts[((j + n) % n) * n + ((i + n) % n)];
      const dd = Math.hypot(i + p[0] - u, j + p[1] - v);
      if (dd < f1) { f2_ = f1; f1 = dd; shade = p[2]; } else if (dd < f2_) f2_ = dd;
    }
    const crease = 1 - smooth(clamp01((f2_ - f1) * 3.2));
    const val = 0.5 + (shade - 0.5) * 0.14 + (R() - 0.5) * 0.14 - crease * 0.3 + (1 - f1) * 0.07;
    const k = (y * size + x) * 4;
    if (val >= 0.5) { d[k] = d[k + 1] = d[k + 2] = 255; d[k + 3] = Math.min(255, (val - 0.5) * 2 * 30); }
    else { d[k] = d[k + 1] = d[k + 2] = 0; d[k + 3] = Math.min(255, (0.5 - val) * 2 * 86); }
  }
  g.putImageData(img, 0, 0);
  return c.toDataURL();
}

  const g = c.getContext('2d'), img = g.createImageData(size, size), d = img.data, R = mulberry32(9);
  for (let i = 0; i < size * size; i++) { const w = R() < 0.5 ? 255 : 0; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = w; d[i * 4 + 3] = Math.round(R() * 9); }
  g.putImageData(img, 0, 0);

function makeSprites() {
  const core = [255, 243, 208], mid = [255, 196, 87], warm = [255, 138, 44];
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const radial = (size, stops) => {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'), r = size / 2, gr = g.createRadialGradient(r, r, 0, r, r, r);
    stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
  };
  const glow = radial(256, [[0, rgba(core, 1)], [0.12, rgba(mid, 0.75)], [0.35, rgba(mid, 0.3)], [0.6, rgba(warm, 0.1)], [1, rgba(warm, 0)]]);
  const soft = radial(256, [[0, rgba(mid, 0.9)], [0.3, rgba(mid, 0.45)], [0.62, rgba(warm, 0.12)], [1, rgba(warm, 0)]]);
  const hot = radial(256, [[0, 'rgba(255,255,250,1)'], [0.25, rgba(core, 0.8)], [0.6, rgba(mid, 0.2)], [1, rgba(mid, 0)]]);
  const dot = radial(64, [[0, 'rgba(255,255,248,1)'], [0.09, rgba(core, 1)], [0.2, rgba(mid, 0.55)], [0.45, rgba(warm, 0.14)], [1, rgba(warm, 0)]]);
  const bokeh = radial(128, [[0, rgba(mid, 0.42)], [0.55, rgba(mid, 0.36)], [0.8, rgba(core, 0.3)], [0.9, rgba(mid, 0.12)], [1, rgba(mid, 0)]]);
  const star = radial(16, [[0, 'rgba(235,232,255,1)'], [0.35, 'rgba(200,196,255,.35)'], [1, 'rgba(200,196,255,0)']]);
  const glint = (() => {
    const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
    const g = c.getContext('2d'); g.globalCompositeOperation = 'lighter';
    for (const horizontal of [true, false]) {
      const gr = horizontal ? g.createLinearGradient(0, 0, s, 0) : g.createLinearGradient(0, 0, 0, s);
      gr.addColorStop(0, rgba(mid, 0)); gr.addColorStop(0.5, rgba(core, 1)); gr.addColorStop(1, rgba(mid, 0));
      g.fillStyle = gr; if (horizontal) g.fillRect(0, s / 2 - 1.2, s, 2.4); else g.fillRect(s / 2 - 1.2, 0, 2.4, s);
    }
    g.drawImage(dot, s / 2 - 24, s / 2 - 24, 48, 48); return c;
  })();
  const ray = (tint) => {   // narrow at the base (bottom), widening and fading upward
    const w = 64, h = 512, c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) {
      const fy = y / (h - 1), wf = lerp(1, 0.16, Math.pow(fy, 0.8));
      const along = Math.pow(fy, 1.6) * (1 - 0.85 * smooth(ramp(fy, 0.9, 1)));
      const col = [lerp(tint[0], core[0], fy * fy), lerp(tint[1], core[1], fy * fy), lerp(tint[2], core[2], fy * fy)];
      for (let x = 0; x < w; x++) {
        const dx = (x - (w - 1) / 2) / ((w / 2) * wf), a = along * Math.exp(-dx * dx * 3.4), k = (y * w + x) * 4;
        d[k] = col[0]; d[k + 1] = col[1]; d[k + 2] = col[2]; d[k + 3] = Math.min(255, a * 255);
      }
    }
    g.putImageData(img, 0, 0); return c;
  };
  return { glow, soft, hot, dot, bokeh, star, glint, rayGold: ray([255, 206, 110]), rayWarm: ray([255, 160, 70]) };
}

  }
  const darkOf = (theta) => clamp01((LIGHT[2] - lambert(theta)) / LIGHT[2]) * 0.55;

  /* ─────────── render (pure function of t) ─────────── */
  let fxClear = false;
  function render(t) {
    if (!G) return;
    t = clamp(t, 0, END);
    if (reduced) return renderReduced(t);
    const done = t >= END;
    root.classList.toggle('is-done', done);
    if (done) { renderEnd(); return; }
    const S = stateAt(t), cam = S.cam, { W, H, PW, PH, Tb, Tp } = G;

    setO(el.veil, (1 - smooth(ramp(t, TL.veil[0], TL.veil[1]))) * TL.veilFrom);
    setT(el.world, camCSS(cam));

    /* cover */
    setT(el.cover, `translate3d(0px,${f2(-H / 2)}px,${f2(G.zA)}px) rotateY(${S.ca.toFixed(2)}deg)`);
    const car = S.ca * DEG;
    setO(el.coShade, clamp01((LIGHT[2] - Math.max(0, Math.sin(car) * LIGHT[0] + Math.cos(car) * LIGHT[2])) / LIGHT[2]) * 0.7);
    setO(el.ciShade, clamp01((LIGHT[2] - Math.max(0, -Math.sin(car) * LIGHT[0] - Math.cos(car) * LIGHT[2])) / LIGHT[2]) * 0.42 * (1 - S.leak));
    setO(el.ciWarm, Math.min(1, S.leak * 0.75 + S.surf * 0.85));
    setO(cedgeNLit, S.leak * 0.85 + S.surf * 0.2);
    setO(cedgeFLit, S.leak * 0.9);
    // sheen: already on the cover at t=0, sweeps across; the holographic foil shifts with it
    const ps = inOutSine(ramp(t, TL.sheen[0], TL.sheen[1]));
    const sc = lerp(0.2, 1.3, ps);
    setT(el.gloss, `translateX(${f2((sc / 0.72 - 0.5) * 100)}%) skewX(-20deg)`);
    setT(el.spec, `translateX(${f2((sc / 0.34 - 0.5) * 100)}%) skewX(-20deg)`);
    setT(el.holo1, `translateX(${f2(-(10 + 12 * ps + 9 * S.open))}%)`);
    setT(el.holo2, `translateX(${f2(-(36 - 16 * ps - 8 * S.open))}%)`);

    /* leaves (only visible while flipping) */
    const pl = ramp(t, TL.lift[0], TL.lift[1]);
    const g = S.surf, pgL = Math.min(1, S.surf * 0.95 + S.flash * 0.3);
    let castR = 0.32 * Math.sin(-car) * clamp01((S.ca + 125) / 50), castL = 0;
    for (let i = 0; i < LEAF.n; i++) {
      const L = leaves[i], qv = leafP(i, t), vis = qv > 0 && qv < 1;
      if (L.vis !== vis) { setV(L.leaf, vis); L.vis = vis; }
      if (!vis) continue;
      const e = inOutCubic(qv);
      const c = -LEAF_CURL * Math.sin(2 * Math.PI * qv) * (1 - 0.2 * qv) + LEAF_BOW * Math.sin(Math.PI * qv);   // tip leads, then trails; bowed mid-flip
      const rootA = clamp(-180 * e - c * 0.5, -180, 0);
      const cEff = clamp(c, -180 - rootA, -rootA);                         // never curls below the page blocks
      const z = lerp(S.zR + 0.6, S.zL + 0.5, e) + Math.sin(Math.PI * qv) * Tp * 0.1 + i * 0.03;
      setT(L.leaf, `translate3d(0px,${f2(-PH / 2)}px,${f2(z)}px) rotateY(${f2(rootA)}deg)`);
      let wsum = 0; const wts = [];
      for (let s = 1; s < STRIPS; s++) { const ww = Math.pow(s / STRIPS, 1.25); wts.push(ww); wsum += ww; }
      const ang = [rootA]; let acc = rootA;
      for (let s = 1; s < STRIPS; s++) {
        const bend = (cEff * wts[s - 1]) / wsum; acc += bend; ang.push(acc);
        setT(L.strips[s].strip, `rotateY(${f2(bend)}deg)`);
      }
      // joint-interpolated (Gouraud) shading: each strip blends its two joint values with two opacity ramps
      const jointA = (j) => (j <= 0 ? ang[0] : j >= STRIPS ? ang[STRIPS - 1] : (ang[j - 1] + ang[j]) / 2);
      const jd = [], jw = [];
      for (let j = 0; j <= STRIPS; j++) {
        const th = jointA(j), u = j / STRIPS, up = Math.abs(Math.sin(th * DEG));
        jd.push(darkOf(th) * (1 - 0.5 * g));
        jw.push(Math.min(0.95, Math.max(pgL, 0.25) * (0.9 * Math.exp(-1.6 * u) + 0.3 * up)));   // same radial falloff as the page glow, plus light caught while standing
      }
      for (let s = 0; s < STRIPS; s++) {
        const st = L.strips[s];
        setO(st.d0, f2(jd[s])); setO(st.d1, f2(jd[s + 1])); setO(st.w0, f2(jw[s])); setO(st.w1, f2(jw[s + 1]));
      }
      const mid = -(rootA + cEff * 0.5), sm = Math.sin(mid * DEG);
      castR += 0.26 * sm * clamp01((125 - mid) / 50);
      castL += 0.22 * sm * clamp01((mid - 55) / 50);
    }

    /* page blocks */
    setT(el.pageR, `translate3d(0px,${f2(-PH / 2)}px,${f2(S.zR)}px)`);
    setT(el.edgeR, `translate3d(0px,${f2(PH / 2)}px,${f2(S.zR)}px) rotateX(-90deg) scaleY(${S.rf.toFixed(4)})`);
    setV(el.pageL, S.firstLanded); setV(el.edgeL, S.firstLanded);
    setT(el.pageL, `translate3d(${-PW}px,${f2(-PH / 2)}px,${f2(S.zL)}px)`);
    setT(el.edgeL, `translate3d(${-PW}px,${f2(PH / 2)}px,${f2(S.zL)}px) rotateX(-90deg) scaleY(${Math.max(0.001, (S.zL - Tb) / Tp).toFixed(4)})`);
    const pg = Math.min(1, S.surf * 0.95 + S.flash * 0.3);
    setO(pR.glow, pg); setO(pL.glow, pg);
    setO(pR.cast, clamp01(castR)); setO(pL.cast, clamp01(castL));
    setO(edgeRLit, S.leak * 0.7 + S.surf * 0.45); setO(edgeLLit, S.surf * 0.45);
    setO(el.floorGlow, Math.min(1, S.surf * 0.85 + S.leak * 0.35 + S.flash * 0.2));
    const spread = clamp01(-Math.cos(car));
    setT(el.shadowL, `translate3d(${f2(-W * spread - W * 0.012)}px,${f2(-H / 2 + H * 0.02)}px,0.1px) scaleX(${spread.toFixed(4)})`);
    setO(el.shadowL, smooth(clamp01((spread - 0.45) / 0.55)) * 0.95);

    /* lifted page: rises with a small free-edge peel; the camera flattens onto it (1:1 at the end) */
    const liftOn = t >= TL.lift[0];
    setV(el.lift, liftOn); setV(el.liftShadow, liftOn);
    if (liftOn) {
      const le = inOutCubic(pl);
      const peel = -9 * Math.sin(Math.PI * Math.pow(ramp(pl, 0, 0.85), 0.8));
      setT(el.lift, `translate3d(0px,${f2(-PH / 2)}px,${f2(S.zR + 0.3 + G.liftH * le)}px) rotateY(${f2(peel)}deg)`);
      setT(el.liftShadow, `translate3d(${f2(PW * 0.04 * le)}px,${f2(-PH / 2 + PH * 0.03 * le)}px,${f2(S.zR + 0.15)}px)`);
      setO(el.liftShadow, 0.8 * smooth(ramp(pl, 0, 0.45)));
      setO(pLift.glow, pg * (1 - smooth(ramp(pl, 0.35, 0.92))));
      setO(pLift.gut, 1 - smooth(ramp(pl, 0, 0.6)));
    }

    /* sheet: same pixels as the lifted page, then the clip opens out to the target rect */
    const pS = ramp(t, TL.sheet[0], TL.sheet[1]);
    if (t < TL.sheet[0]) {
      setV(el.sheet, false); setV(el.sheetShadow, false);
    } else {
      setV(el.sheet, true); setV(el.sheetShadow, true);
      const e = inOutSine(pS), R = G.rect, T = G.T;
      const x = lerp(R.x, T.x, e) - T.x, y = lerp(R.y, T.y, e) - T.y;
      const sx = lerp(R.w, T.w, e) / T.w, sy = lerp(R.h, T.h, e) / T.h;
      const outer = `translate(${f2(x)}px,${f2(y)}px) scale(${sx.toFixed(5)},${sy.toFixed(5)})`;
      setT(el.sheet, outer); setT(el.sheetShadow, outer);
      setT(el.sheetIn, `scale(${(1 / sx).toFixed(5)},${(1 / sy).toFixed(5)}) translate(${f2(-x)}px,${f2(-y)}px)`);
      setO(el.sheet, smooth(clamp01((t - TL.sheet[0]) / 50)));
      setO(el.sheetShadow, smooth(clamp01((t - TL.sheet[0]) / 50)) * (1 - smooth(e)));
    }
    const tp = outCubic(ramp(t, TL.text[0], TL.text[1]));
    setO(el.head, tp); setT(el.head, `translateY(${f2((1 - tp) * 8)}px)`);
    setO(el.entry, tp);
    setT(el.dateline, `scaleX(${inOutCubic(ramp(t, TL.text[0] + 80, TL.text[1])).toFixed(4)})`);
    setO(el.caret, 0);
    setO(el.grade, Math.min(1, S.rays * 0.85 + S.leak * 0.25));
    setO(el.vignette, 1 - smooth(ramp(pl, 0.1, 0.8)));
    setO(el.sound, smooth(ramp(t, 0, 200)) * (1 - smooth(ramp(t, TL.sheet[0], TL.text[1]))));

    drawFX(S, t);
  }

  function renderEnd() {
    setV(el.sheet, true); setV(el.sheetShadow, false);
    setT(el.sheet, 'none'); setT(el.sheetIn, 'none'); setO(el.sheet, 1);
    setO(el.head, 1); setT(el.head, 'none'); setO(el.entry, 1); setT(el.dateline, 'none');
    setO(el.caret, 1);
    clearFX();
  }
  function renderReduced(t) {
    const p = inOutSine(ramp(t, 0, TL.reducedEnd)), done = t >= TL.reducedEnd;
    root.classList.toggle('is-done', done);
    setV(el.sheet, true); setV(el.sheetShadow, false);
    setT(el.sheet, 'none'); setT(el.sheetIn, 'none'); setO(el.sheet, p);
    setO(el.head, p); setT(el.head, 'none'); setO(el.entry, p); setT(el.dateline, 'none');
    setO(el.caret, done ? 1 : 0);
    setO(el.sound, 1 - p);
    clearFX();
  }
  function clearFX() {
    if (fxClear) return;
    for (const key of ['bg', 'glow', 'spark']) { cx[key].setTransform(1, 0, 0, 1, 0, 0); cx[key].clearRect(0, 0, cv[key].width, cv[key].height); }
    fxClear = true;
  }

  /* ─────────── canvas light ─────────── */
  function sprite(gc, img, x, y, w, h, a) {
    if (a <= 0.003 || w < 0.3 || h < 0.3) return;
    gc.globalAlpha = a > 1 ? 1 : a;
    gc.drawImage(img, x - w / 2, y - h / 2, w, h);
  }
  function drawFX(S, t) {
    fxClear = false;
    const { vw, vh, W, H, PW, PH } = G, cam = S.cam, z = cam.zoom, unit = G.unit;
    const P3 = (x, y, zz) => project(cam, x, y, zz);
    const ct = Math.cos(cam.tilt * DEG);
    const center = P3(0, -0.05 * PH, S.zTop), kc = center.k;
    const amb = smooth(ramp(t, 720, 1200)) * S.out;
    const fadeAll = 1 - smooth(ramp(t, TL.lightOut[0] + 120, TL.end - 80));
    { const gy = `${(center.y / vh * 100).toFixed(1)}%`; if (el.grade._gy !== gy) { el.grade.style.setProperty('--grade-y', gy); el.grade._gy = gy; } }

    /* behind the book: stars, bloom, the light column and the god rays (pages and leaves occlude them) */
    const b = cx.bg;
    b.setTransform(G.sBg, 0, 0, G.sBg, 0, 0); b.clearRect(0, 0, vw, vh);
    b.globalCompositeOperation = 'lighter';
    for (const s of PART.stars) sprite(b, SPR.star, s.x * vw, s.y * vh, s.s * 2.4, s.s * 2.4, s.a * (0.6 + 0.4 * Math.sin(t * s.f + s.ph)) * (1 - 0.4 * S.rays));
    const bloomA = Math.max(S.surf, S.leak * 0.4) * 0.75 + S.flash * 0.2;
    if (bloomA > 0.005) {
      const c = P3(0, -0.25 * H, 0);
      sprite(b, SPR.soft, c.x, c.y, W * 5.2 * z * c.k, W * 3.1 * z * c.k, bloomA * 0.55);
      sprite(b, SPR.glow, c.x, c.y - W * 0.2 * z, W * 2.6 * z * c.k, W * 1.6 * z * c.k, bloomA * 0.35);
    }
    if (S.rays > 0.003) {
      sprite(b, SPR.soft, center.x, center.y - vh * 0.42, PW * 2.0 * z, vh * 1.3, S.rays * 0.36);
      sprite(b, SPR.hot, center.x, center.y - PH * 0.42 * z, PW * 0.5 * z * kc, PH * 1.3 * z * kc, S.rays * 0.42 + S.flash * 0.2);
      const focal = { x: center.x, y: center.y + W * 1.1 * z };
      for (const r of PART.rays) {
        const grow = outQuart(ramp(t, r.t0, r.t0 + 420));
        if (grow <= 0) continue;
        const base = P3(r.u * PW, r.v * PH, S.zTop);
        const angR = Math.atan2(base.x - focal.x, focal.y - base.y) * 1.1 + r.jitter;
        const len = vh * r.len * grow * 1.05, wTop = W * r.w * z * 1.35;
        const a = r.a * (0.72 + 0.28 * Math.sin(t * r.f + r.ph)) * S.rays * (0.6 + 0.4 * grow) + S.flash * 0.12;
        b.save(); b.translate(base.x, base.y); b.rotate(angR); b.globalAlpha = Math.min(1, a);
        b.drawImage(r.warm ? SPR.rayWarm : SPR.rayGold, -wTop / 2, -len, wTop, len); b.restore();
      }
    }
    drawAmbient(b, t, amb, center, 0);

    /* in front, half-res: the fore-edge leak, and the gutter core / page glow only */
    const gl = cx.glow;
    gl.setTransform(G.sGlow, 0, 0, G.sGlow, 0, 0); gl.clearRect(0, 0, vw, vh);
    gl.globalCompositeOperation = 'lighter';
    if (S.leak > 0.005) {
      const c = P3(PW * 0.99, 0, S.zR + G.Tb);
      sprite(gl, SPR.glow, c.x, c.y, W * 0.55 * z * c.k, H * 1.05 * z * c.k * ct, S.leak * 0.85);
      sprite(gl, SPR.hot, c.x, c.y, W * 0.12 * z * c.k, H * 0.9 * z * c.k * ct, S.leak * 0.75);
      sprite(gl, SPR.soft, c.x + W * 0.15 * z, c.y - W * 0.22 * z, W * 1.1 * z, W * 1.3 * z, S.leak * 0.3);
    }
    if (S.surf > 0.003) {
      sprite(gl, SPR.glow, center.x, center.y, PW * 2.0 * z * kc, PH * 0.95 * z * kc * ct, S.surf * 0.42 + S.flash * 0.25);
      for (let i = 0; i < 7; i++) {
        const p = P3(0, lerp(-0.42, 0.42, i / 6) * PH, S.zTop);
        sprite(gl, SPR.soft, p.x, p.y, PW * 0.42 * z * p.k, PW * 0.3 * z * p.k, S.surf * 0.22);
      }
      sprite(gl, SPR.hot, center.x, center.y + PH * 0.03 * z * ct, PW * 0.8 * z * kc, PH * 0.5 * z * kc * ct, S.surf * 0.45 + S.flash * 0.35);
      sprite(gl, SPR.hot, center.x, center.y - PH * 0.1 * z, PW * 0.24 * z * kc, PH * 0.42 * z * kc, S.rays * 0.2);
    }

    /* sparks (full-res, in front): born on the pages and rising in book space → true perspective parallax */
    const sp = cx.spark;
    sp.setTransform(G.sSpark, 0, 0, G.sSpark, 0, 0); sp.clearRect(0, 0, vw, vh);
    sp.globalCompositeOperation = 'lighter';
    if (fadeAll > 0.003) {
      for (const p of PART.leak) {
        const age = (t - p.t0) / 1000;
        if (age < 0 || age > p.life) continue;
        const qq = age / p.life, pos = P3(PW * (0.98 + p.vx * age), p.v * PH, S.zR + G.Tb + W * p.vz * age);
        if (pos.w < 0.4) continue;
        const a = p.a * smooth(clamp01(qq * 6)) * (1 - smooth(ramp(qq, 0.45, 1))) * (0.7 + 0.3 * Math.sin(t * 0.001 * p.tw + p.ph)) * fadeAll;
        const sz = p.size * unit * Math.min(pos.k, 2.2);
        sprite(sp, SPR.dot, pos.x, pos.y, sz, sz, a);
      }
      for (const p of PART.sparks) {
        const age = (t - p.t0) / 1000;
        if (age < 0 || age > p.life) continue;
        const qq = age / p.life;
        const x = p.u * PW + W * (p.vx * age + p.sway * Math.sin(age * p.sf + p.ph));
        const y = p.v * PH + W * p.vy * age;
        const zz = S.zTop + W * p.vz * age * (1 + 0.35 * age);
        const pos = P3(x, y, zz);
        if (pos.w < 0.4) continue;
        const tw = 0.6 + 0.4 * Math.sin(t * 0.001 * p.tw + p.ph);
        const a = p.a * smooth(clamp01(qq * 7)) * (1 - smooth(ramp(qq, 0.4, 1))) * tw * fadeAll * (0.35 + 0.65 * S.out);
        const sz = p.size * unit * Math.min(pos.k, 2.2);
        sprite(sp, p.kind === 'glint' ? SPR.glint : p.kind === 'bokeh' ? SPR.bokeh : SPR.dot, pos.x, pos.y, sz, sz, p.kind === 'bokeh' ? a * 0.8 : a);
      }
      drawAmbient(sp, t, amb * fadeAll, center, 1);
      drawAmbient(sp, t, amb * fadeAll, center, 2);
    }
    gl.globalAlpha = 1; sp.globalAlpha = 1; b.globalAlpha = 1;
  }
  // screen-space dust and bokeh in three depth layers, revealed as a wave spreading out from the book
  function drawAmbient(gc, t, amb, center, layer) {
    if (amb <= 0.003) return;
    const { vw, vh, unit } = G, sec = t / 1000;
    for (const p of PART.ambient) {
      if (p.layer !== layer) continue;
      let y = p.y - p.speed * sec; y = ((y % 1) + 1) % 1;
      const x = p.x + p.sway * Math.sin(sec * p.sf + p.ph);
      const px = x * vw, py = y * vh * 0.92;
      const dist = Math.hypot((px - center.x) / vw, (py - center.y) / vh);
      const reveal = smooth(ramp(t, TL.burst[0] + dist * 700, TL.burst[0] + dist * 700 + 350));
      const column = Math.exp(-Math.pow((px - center.x) / (vw * (layer === 2 ? 0.5 : 0.32)), 2));
      const below = py > center.y + 30 ? (layer === 2 ? 0.08 : 0.3) : 1;
      const tw = 0.55 + 0.45 * Math.sin(t * 0.001 * p.tw * 3 + p.ph);
      const a = p.a * amb * reveal * (0.25 + 0.75 * column) * below * (layer === 2 ? 1 : tw);
      const sz = p.size * unit * (layer === 2 ? 1.15 : 1);
      sprite(gc, layer === 2 ? SPR.bokeh : p.glint ? SPR.glint : SPR.dot, px, py, sz, sz, a);
    }
  }

  /* ─────────── sound preference (persisted; the user can turn it off) ─────────── */
  const readPref = () => { try { return localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) { return true; } };
  let soundOn = opt.sound != null ? !!opt.sound : readPref();
  let audio = null, voice = null;
  const paintSound = () => { el.sound.setAttribute('aria-pressed', String(soundOn)); el.sound.setAttribute('aria-label', soundOn ? '효과음 끄기' : '효과음 켜기'); };
  paintSound();
  const stopEv = (e) => e.stopPropagation();
  el.sound.addEventListener('pointerdown', stopEv);
  el.sound.addEventListener('keydown', stopEv);
  el.sound.addEventListener('click', (e) => {
    e.stopPropagation();
    soundOn = !soundOn; paintSound();
    try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch (err) {}
    if (voice) voice.setMuted(!soundOn);
  });
  el.replay.addEventListener('pointerdown', stopEv);
  el.replay.addEventListener('click', (e) => { e.stopPropagation(); play(); });
  function startSound() {
    stopSound(0);
    if (!soundOn) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audio = audio || new AC();
      if (audio.state === 'suspended') audio.resume().catch(() => {});
      voice = playIntroSound(audio, { minimal: reduced });
    } catch (e) { voice = null; }
  }
  function stopSound(fade = 0.12) { if (voice) { voice.stop(fade); voice = null; } }

  /* ─────────── playback / skip / seek ─────────── */
  let raf = 0, t0 = 0, playing = false, cur = 0;
  const cancel = () => { if (raf) cancelAnimationFrame(raf); raf = 0; };
  function finish(fromSeek) {
    cancel(); playing = false; cur = END;
    render(END);
    if (fromSeek) return;
    if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) { try { el.entry.focus({ preventScroll: true }); } catch (e) {} }
    root.dispatchEvent(new CustomEvent('diaryintro:done', { bubbles: true }));
    if (typeof opt.onDone === 'function') opt.onDone();
  }
  function tick(now) {
    cur = now - t0;
    if (cur >= END) { finish(false); return; }
    render(cur);
    raf = requestAnimationFrame(tick);
  }
  function play() {
    cancel();
    root.classList.remove('is-seek', 'is-done');
    playing = true; cur = 0;
    render(0);
    startSound();
    t0 = performance.now();
    raf = requestAnimationFrame(tick);
  }
  function skip() {
    if (!playing) return;
    stopSound(0.15);
    finish(false);
  }
  function seek(ms) {
    cancel(); playing = false; stopSound(0);
    root.classList.add('is-seek');
    cur = clamp(+ms || 0, 0, END);
    if (cur >= END) finish(true); else render(cur);
    return cur;
  }

  const onPointer = (e) => { if (!playing) return; if (e.target.closest && e.target.closest('button, textarea')) return; skip(); };
  const onKey = (e) => { if (playing && (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); skip(); } };
  let rz = 0;
  const onResize = () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { layout(); fxClear = false; if (!playing) render(cur); }); };
  root.addEventListener('pointerdown', onPointer);
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', onResize);

  layout();
  render(0);
  return {
    play, seek, skip, duration: END,
    destroy() { cancel(); stopSound(0); root.removeEventListener('pointerdown', onPointer); window.removeEventListener('keydown', onKey); window.removeEventListener('resize', onResize); root.innerHTML = ''; root.classList.remove('di', 'is-done', 'is-seek', 'is-reduced', 'is-demo'); },
  };
}

/* ═══════════════════════════ Demo boot (the app calls createDiaryIntro itself) ═══════════════════════════ */
const params = new URLSearchParams(location.search);
const dParam = params.get('date');
const date = dParam && /^\d{4}-\d{2}-\d{2}$/.test(dParam) ? (([y, m, d]) => new Date(y, m - 1, d))(dParam.split('-').map(Number)) : new Date();
const rm = params.get('rm');
const intro = createDiaryIntro(document.getElementById('diary-intro'), {
  reducedMotion: rm == null ? undefined : rm === '1',
  sound: params.get('sound') === '0' ? false : undefined,
  date,
  demo: params.get('demo') === '1',
});
window.diaryIntro = intro;
window.createDiaryIntro = createDiaryIntro;
window.playIntroSound = playIntroSound;
window.__seek = (ms) => intro.seek(Number(ms) || 0);
window.__duration = () => intro.duration;
if (params.has('t')) intro.seek(Number(params.get('t')) || 0);
else intro.play();
})();
</script>
