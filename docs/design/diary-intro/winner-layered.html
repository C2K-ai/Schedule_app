<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Diary Intro</title>
<style>
/* ───────────────────────── Tokens (dusk theme) ───────────────────────── */
:root {
  --bg: #0b0920;
  --bg-2: #1b1546;
  --bg-3: #05041a;

  --cover-hi: #2b3082;
  --cover: #1a1d58;
  --cover-lo: #0d0f36;
  --cover-edge: #0b0c2c;

  --gold-1: #fff3c8;
  --gold-2: #ecc777;
  --gold-3: #c4943f;
  --gold-4: #86601f;

  --endpaper: #161a4c;
  --endpaper-lo: #0e1036;
  --endpaper-dot: rgba(236, 199, 119, 0.55);

  --paper-1: #fbf6ea;
  --paper-2: #f1e5cd;
  --paper-edge: #eadcbf;
  --paper-edge-lo: #b9a37c;
  --ink: #3b2d1f;
  --ink-soft: #a8977c;
  --rule: rgba(128, 98, 60, 0.26);
  --hrule: rgba(184, 138, 62, 0.75);

  --ribbon: #e07f43;
  --ribbon-lo: #93431c;

  --light-core: #fff3d0;
  --light-mid: #ffc457;
  --light-warm: #ff8a2c;

  --shadow: rgba(3, 2, 14, 0.82);

  --serif: "Cormorant Garamond", "Playfair Display", Didot, "Bodoni 72", "Libre Baskerville", Georgia, "Times New Roman", serif;
  --sans: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "WenQuanYi Zen Hei", system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: var(--sans); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }

/* ───────────────────────── Stage & layers ───────────────────────── */
.stage {
  position: fixed; inset: 0; overflow: hidden; contain: strict;
  background:
    radial-gradient(90% 60% at 50% 46%, var(--bg-2) 0%, rgba(27, 21, 70, 0) 70%),
    radial-gradient(140% 100% at 50% 40%, var(--bg) 40%, var(--bg-3) 100%);
  user-select: none; -webkit-user-select: none; touch-action: manipulation; cursor: pointer;
}
.stage.done { cursor: auto; }
.fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.fx-glow, .fx-spark { mix-blend-mode: screen; }
.scene { position: absolute; inset: 0; perspective: var(--persp, 1200px); perspective-origin: 50% 50%; }
.veil { position: absolute; inset: 0; background: var(--bg-3); pointer-events: none; }
.vignette { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 90% at 50% 50%, transparent 52%, rgba(3, 2, 14, 0.6) 100%); }
.dim { position: absolute; inset: 0; background: var(--bg-3); opacity: 0; pointer-events: none; }
/* golden-hour grade: multiplies the blue out of the backdrop around the light column so additive gold reads as gold */
.grade { position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: multiply;
  background: radial-gradient(62% 85% at 50% var(--grade-y, 55%), var(--grade-core, #ffcf96) 0%, #ffe6c6 48%, #fff 100%); }
.stage.done .book, .stage.done .fx, .stage.done .vignette, .stage.done .dim, .stage.done .grade { visibility: hidden; }

/* ───────────────────────── 3D book ─────────────────────────
   .book is a zero-size anchor at the stage centre. Book space: x → right (spine at x=0),
   y → toward the viewer's near edge, z → up off the table. Faces (.f) are flat; containers (.c3) keep 3D. */
.book { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
.book .c3 { position: absolute; transform-style: preserve-3d; }
.book .f { position: absolute; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.book .f.two { backface-visibility: visible; -webkit-backface-visibility: visible; }

.floor {
  left: calc(var(--W) * -3.4); top: calc(var(--H) * -2.1);
  width: calc(var(--W) * 6.8); height: calc(var(--H) * 4.2);
  background: radial-gradient(closest-side, rgba(84, 74, 170, 0.26), rgba(44, 36, 110, 0.1) 55%, rgba(0, 0, 0, 0) 100%);
}
.floor-glow {
  left: calc(var(--W) * -2.3); top: calc(var(--H) * -1.55);
  width: calc(var(--W) * 4.6); height: calc(var(--H) * 3.1);
  background: radial-gradient(closest-side, rgba(255, 186, 96, 0.55), rgba(255, 140, 56, 0.14) 40%, rgba(255, 130, 50, 0) 75%);
  transform: translateZ(0.15px); opacity: 0;
}
.shadow {
  top: calc(var(--H) / -2); width: var(--W); height: var(--H); border-radius: 4px;
  background: var(--shadow);
  box-shadow:
    0 calc(var(--W) * 0.03) calc(var(--W) * 0.05) calc(var(--W) * 0.012) rgba(3, 2, 14, 0.7),
    0 calc(var(--W) * 0.09) calc(var(--W) * 0.22) calc(var(--W) * 0.05) rgba(3, 2, 14, 0.5);
  transform: translateZ(0.3px);
}
.shadow.r { left: 0; }
.shadow.l { left: calc(var(--W) * -1); opacity: 0; }

/* boards (hard covers) */
.board-top {
  left: 0; top: calc(var(--H) / -2); width: var(--W); height: var(--H); border-radius: 2px;
  background: linear-gradient(160deg, var(--cover) 0%, var(--cover-lo) 100%);
  transform: translateZ(var(--Tb));
}
.edge { transform-origin: 50% 0; }
.board-edge {
  left: 0; top: calc(var(--H) / 2); width: var(--W); height: var(--Tb);
  background: linear-gradient(to bottom, #262a6e, var(--cover-edge));
  transform: translateZ(var(--Tb)) rotateX(-90deg);
}

/* page blocks */
.block-top { top: calc(var(--PH) / -2); width: var(--PW); height: var(--PH); overflow: hidden; }
.block-top.r { left: 0; }
.block-top.l { left: calc(var(--PW) * -1); opacity: 0; }
.block-edge {
  top: calc(var(--PH) / 2); width: var(--PW); height: var(--Tp); overflow: hidden;
  background:
    linear-gradient(to bottom, rgba(255, 255, 255, 0.25), rgba(0, 0, 0, 0) 30%, rgba(70, 45, 15, 0.28) 100%),
    repeating-linear-gradient(to bottom, var(--paper-edge) 0 1px, #dccaa6 1px 2px);
}
.block-edge.r { left: 0; }
.block-edge.l { left: calc(var(--PW) * -1); }
.block-edge .rib { position: absolute; left: 13%; width: 4.2%; top: 0; bottom: 0;
  background: linear-gradient(to right, var(--ribbon-lo), var(--ribbon) 45%, var(--ribbon-lo)); }

/* ruled paper — shared by book pages, flipping leaves and the hero sheet */
.paper {
  background:
    radial-gradient(130% 90% at 35% 20%, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0) 60%),
    linear-gradient(175deg, var(--paper-1), var(--paper-2));
}
.paper .lines {
  position: absolute; left: var(--mx); right: var(--mx); top: var(--gtop); bottom: 6%;
  background: repeating-linear-gradient(to bottom,
    transparent 0, transparent calc(var(--gap) - var(--lw)),
    var(--rule) calc(var(--gap) - var(--lw)), var(--rule) var(--gap));
}
.paper .hrule {
  position: absolute; left: var(--mx); right: var(--mx); top: calc(var(--gtop) - var(--lw) * 1.5); height: calc(var(--lw) * 1.5);
  background: linear-gradient(to right, var(--hrule), rgba(184, 138, 62, 0.35) 70%, rgba(184, 138, 62, 0));
}
.pgvars { --gap: var(--p-gap); --gtop: var(--p-gtop); --lw: 1px; --mx: 7%; --rule: var(--p-rule); }
.gut-l { position: absolute; inset: 0; background: linear-gradient(to right, rgba(84, 56, 20, 0.34), rgba(84, 56, 20, 0.08) 7%, rgba(84, 56, 20, 0) 16%); }
.gut-r { position: absolute; inset: 0; background: linear-gradient(to left, rgba(84, 56, 20, 0.34), rgba(84, 56, 20, 0.08) 7%, rgba(84, 56, 20, 0) 16%); }
.pglow { position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(110% 95% at var(--gx, 0%) 42%, rgba(255, 206, 120, 0.85), rgba(255, 184, 96, 0.32) 42%, rgba(255, 160, 70, 0) 78%); }
.pglow.r { --gx: 0%; }
.pglow.l { --gx: 100%; }

/* ribbon on the table */
.rib-top { left: calc(var(--PW) * 0.13); top: calc(var(--PH) / 2); width: calc(var(--PW) * 0.042); height: calc(var(--sq) + 0.5px);
  background: linear-gradient(to right, var(--ribbon-lo), var(--ribbon) 45%, var(--ribbon-lo)); transform: translateZ(calc(var(--Tb) + 0.4px)); }
.rib-floor { left: calc(var(--PW) * 0.13); top: calc(var(--H) / 2); width: calc(var(--PW) * 0.042); height: calc(var(--H) * 0.17);
  transform-origin: 50% 0; transform: translateZ(0.6px) rotateZ(9deg);
  background: linear-gradient(to right, var(--ribbon-lo), var(--ribbon) 45%, var(--ribbon-lo));
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%); }
.board-edge .rib { position: absolute; left: 13%; width: 4.2%; top: 0; bottom: 0; background: var(--ribbon-lo); }

/* front cover */
.cover { left: 0; top: calc(var(--H) / -2); width: var(--W); height: var(--H); transform-origin: 0 50%; }
.cover-out, .cover-in { inset: 0; border-radius: 2px 3px 3px 2px; overflow: hidden; }
.cover-out {
  font-size: calc(var(--W) * 0.01);
  background:
    var(--leather, none),
    radial-gradient(120% 85% at 28% 18%, var(--cover-hi) 0%, var(--cover) 45%, var(--cover-lo) 100%);
  background-size: calc(var(--W) * 0.55) auto, auto;
  box-shadow: inset 0 0 0.9em rgba(0, 0, 0, 0.55), inset 0.15em 0.15em 0.3em rgba(255, 255, 255, 0.06);
  transform: translateZ(var(--dOut));
}
.cover-out .groove { position: absolute; top: 0; bottom: 0; left: 6.5%; width: 1.6em;
  background: linear-gradient(to right, rgba(0, 0, 0, 0.42), rgba(0, 0, 0, 0.05) 45%, rgba(255, 255, 255, 0.07) 60%, rgba(0, 0, 0, 0) 100%); }
.foil {
  background: linear-gradient(118deg, var(--gold-4) 0%, var(--gold-2) 20%, var(--gold-3) 36%, var(--gold-1) 50%, var(--gold-3) 64%, var(--gold-2) 80%, var(--gold-4) 100%);
}
.cover-out .frame { position: absolute; left: 15%; right: 8%; top: 7%; bottom: 7%;
  border: max(1px, 0.25em) solid transparent;
  border-image: linear-gradient(135deg, var(--gold-3), var(--gold-1) 30%, var(--gold-3) 55%, var(--gold-2) 80%, var(--gold-4)) 1;
  opacity: 0.92; }
.cover-out .frame.in { left: 17.2%; right: 10.2%; top: 8.6%; bottom: 8.6%; border-width: max(0.6px, 0.12em); opacity: 0.6; }
.cover-out .orn { position: absolute; width: 2.2em; height: 2.2em; transform: translate(-50%, -50%) rotate(45deg); }
.cover-out .orn::after { content: ""; position: absolute; inset: 28%; background: var(--cover-lo); }
.cover-out .emblem { position: absolute; left: 53.5%; top: 31%; width: 15em; height: 15em; transform: translate(-50%, -50%); }
.cover-out .emblem svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0.12em 0.08em rgba(0, 0, 0, 0.55)); }
.cover-out .title {
  position: absolute; left: 53.5%; top: 47%; transform: translate(-50%, -50%);
  font-family: var(--serif); font-weight: 500; font-size: 13.2em; letter-spacing: 0.24em; text-indent: 0.24em; line-height: 1;
  white-space: nowrap; color: transparent; -webkit-background-clip: text; background-clip: text;
  filter: drop-shadow(0 0.08em 0.05em rgba(0, 0, 0, 0.6));
}
.cover-out .year { position: absolute; left: 53.5%; top: 57.5%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 1.6em; }
.cover-out .year b { display: block; width: 6em; height: max(0.6px, 0.16em); }
.cover-out .year span { font-family: var(--serif); font-size: 4.6em; letter-spacing: 0.3em; text-indent: 0.3em; color: transparent;
  -webkit-background-clip: text; background-clip: text; filter: drop-shadow(0 0.06em 0.04em rgba(0, 0, 0, 0.6)); }
.cover-out .sheen { position: absolute; top: -30%; bottom: -30%; left: 0; width: 70%;
  background: linear-gradient(90deg, rgba(255, 236, 200, 0) 0%, rgba(255, 236, 200, 0.05) 30%, rgba(255, 236, 200, 0.12) 50%, rgba(255, 236, 200, 0.05) 70%, rgba(255, 236, 200, 0) 100%);
  transform: translateX(-140%) skewX(-22deg); }
.cover-out .shade, .cover-in .shade { position: absolute; inset: 0; background: #02010c; opacity: 0; }

.cover-in { transform: translateZ(var(--dIn)) rotateY(180deg);
  background: var(--cover-lo); }
.cover-in .endpaper { position: absolute; left: var(--sq); right: 0; top: var(--sq); bottom: var(--sq);
  background:
    radial-gradient(circle at 30% 30%, var(--endpaper-dot) 0 0.7px, transparent 1.3px) 0 0 / 15px 15px,
    radial-gradient(circle at 70% 75%, rgba(236, 199, 119, 0.35) 0 0.5px, transparent 1px) 0 0 / 11px 11px,
    linear-gradient(160deg, var(--endpaper), var(--endpaper-lo)); }
.cover-in .gut-r { background: linear-gradient(to left, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0) 14%); }
.cover-in .warm { position: absolute; inset: 0; opacity: 0;
  background: radial-gradient(110% 90% at 100% 45%, rgba(255, 200, 120, 0.55), rgba(255, 170, 90, 0.12) 50%, rgba(255, 160, 80, 0) 80%); }
.cover-edge.near { left: 0; top: 100%; width: 100%; height: var(--Tb); transform-origin: 50% 0;
  background: linear-gradient(to bottom, #2a2e74, var(--cover-edge)); transform: translateZ(var(--dOut)) rotateX(-90deg); }
.cover-edge.fore { left: 100%; top: 0; width: var(--Tb); height: 100%; transform-origin: 0 50%;
  background: linear-gradient(to right, #2a2e74, var(--cover-edge)); transform: translateZ(var(--dOut)) rotateY(90deg); }

/* flipping leaves: nested segments so a page can curl */
.leaf { left: 0; top: calc(var(--PH) / -2); width: calc(var(--PW) / 6); height: var(--PH); transform-origin: 0 50%; visibility: hidden; }
.leaf .seg { left: 100%; top: 0; width: 100%; height: 100%; transform-origin: 0 50%; }
.leaf .pg { inset: 0 -0.8px 0 0; overflow: hidden; }
.leaf .pg .lines, .leaf .pg .hrule { --mx: 0%; opacity: 0.55; }
.leaf .s0 .lines, .leaf .s0 .hrule { left: 42%; }
.leaf .s5 .lines, .leaf .s5 .hrule { right: 42%; }
.leaf .lit { position: absolute; inset: 0; opacity: 0;
  background: rgba(255, 204, 120, 0.5); }

/* ───────────────────────── Hero sheet (becomes the writing page) ───────────────────────── */
.hero { position: absolute; inset: 0; transform-origin: 50% 50%; visibility: hidden; opacity: 0;
  --gap: var(--h-gap); --gtop: var(--h-gtop); --lw: 1px; --mx: 7%; }
.hero .hshadow { position: absolute; inset: 0; opacity: 0; box-shadow: 0 3vh 9vh rgba(2, 1, 12, 0.75); }
.hero .sheet { position: absolute; inset: 0; overflow: hidden; }
.hero .sheet::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 12vmin rgba(150, 110, 55, 0.14); }
.hero .gut-l, .hero .pglow { pointer-events: none; }
.hero .content { position: absolute; inset: 0; opacity: 0; }
.hero header { position: absolute; left: var(--mx); right: var(--mx); bottom: calc(100% - var(--gtop) + 14px); }
.hero .eyebrow { display: flex; align-items: center; gap: 8px; font-family: var(--serif); font-size: 12px; letter-spacing: 0.32em;
  color: #b8893c; text-transform: uppercase; margin-bottom: 6px; }
.hero .eyebrow svg { width: 13px; height: 13px; }
.hero .date { font-size: 23px; font-weight: 650; letter-spacing: -0.01em; color: var(--ink); }
.hero .date span { font-weight: 500; color: #8a7558; margin-left: 2px; }
.hero textarea {
  position: absolute; left: var(--mx); right: var(--mx); top: var(--gtop); bottom: 6%;
  padding-top: calc(var(--gap) * 0.14); border: 0; outline: 0; resize: none; background: transparent;
  font: 400 16.5px/var(--gap) var(--sans); color: var(--ink); caret-color: #d0773a;
}
.hero textarea::placeholder { color: var(--ink-soft); opacity: 0.85; }
@media (min-width: 700px) { .hero .date { font-size: 27px; } .hero textarea { font-size: 18px; } .hero .eyebrow { font-size: 13px; } }

/* ───────────────────────── Chrome (sound toggle, demo replay) ───────────────────────── */
.ctrl { position: absolute; top: max(14px, calc(env(safe-area-inset-top) + 8px)); right: 14px; z-index: 5;
  width: 38px; height: 38px; border-radius: 50%; border: 0; padding: 0; background: none; cursor: pointer; }
.ctrl .skin { position: absolute; inset: 0; border-radius: 50%; display: grid; place-items: center; transition: none; }
.ctrl .skin.dark { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.14); color: rgba(246, 243, 255, 0.82); }
.ctrl .skin.light { background: rgba(120, 90, 50, 0.07); border: 1px solid rgba(120, 90, 50, 0.18); color: #8a6f4c; opacity: 0; }
.ctrl svg { width: 18px; height: 18px; }
.ctrl .ic-off { display: none; }
.ctrl[aria-pressed="false"] .ic-on { display: none; }
.ctrl[aria-pressed="false"] .ic-off { display: block; }
.ctrl:focus-visible { outline: 2px solid #ffa36c; outline-offset: 2px; }
.replay { position: absolute; right: 16px; bottom: max(16px, calc(env(safe-area-inset-bottom) + 10px)); z-index: 5;
  font: 600 13px var(--sans); color: #7a6345; background: rgba(120, 90, 50, 0.08); border: 1px solid rgba(120, 90, 50, 0.2);
  border-radius: 999px; padding: 8px 14px; cursor: pointer; display: none; }
.stage.done .replay { display: block; }
html.seeking .replay { display: none !important; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas class="fx fx-bg" id="bgCanvas"></canvas>

  <div class="scene" id="scene">
    <div class="book" id="book">
      <div class="f floor"></div>
      <div class="f floor-glow" id="floorGlow"></div>
      <div class="f shadow r"></div>
      <div class="f shadow l" id="shadowL"></div>
      <div class="f rib-floor"></div>

      <div class="f board-top"></div>
      <div class="f edge board-edge"><div class="rib"></div></div>
      <div class="f rib-top"></div>

      <div class="f block-top r paper pgvars" id="pageR"><div class="hrule"></div><div class="lines"></div><div class="gut-l"></div><div class="pglow r" id="pageRGlow"></div></div>
      <div class="f edge block-edge r" id="edgeR"><div class="rib"></div></div>

      <div class="f block-top l paper pgvars" id="pageL"><div class="hrule"></div><div class="lines"></div><div class="gut-r"></div><div class="pglow l" id="pageLGlow"></div></div>
      <div class="f edge block-edge l" id="edgeL"></div>

      <div id="leaves"></div>

      <div class="c3 cover" id="cover">
        <div class="f cover-out" id="coverOut">
          <div class="groove"></div>
          <div class="frame"></div>
          <div class="frame in"></div>
          <i class="orn foil" style="left:15%;top:7%"></i>
          <i class="orn foil" style="left:92%;top:7%"></i>
          <i class="orn foil" style="left:15%;top:93%"></i>
          <i class="orn foil" style="left:92%;top:93%"></i>
          <div class="emblem">
            <svg viewBox="0 0 40 40" aria-hidden="true">
              <defs>
                <linearGradient id="gfoil" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#fff3c8" /><stop offset=".38" stop-color="#d4a650" />
                  <stop offset=".62" stop-color="#f7dc98" /><stop offset="1" stop-color="#8f6824" />
                </linearGradient>
                <mask id="moonCut"><rect width="40" height="40" fill="#fff" /><circle cx="24.6" cy="16.6" r="10.2" fill="#000" /></mask>
              </defs>
              <circle cx="20" cy="21" r="12" fill="url(#gfoil)" mask="url(#moonCut)" />
              <path d="M30.5 5.5 L31.4 9.6 L35.5 10.5 L31.4 11.4 L30.5 15.5 L29.6 11.4 L25.5 10.5 L29.6 9.6 Z" fill="url(#gfoil)" />
              <circle cx="35" cy="19" r="0.9" fill="url(#gfoil)" />
            </svg>
          </div>
          <div class="title foil">DIARY</div>
          <div class="year"><b class="foil"></b><span class="foil">2026</span><b class="foil"></b></div>
          <div class="sheen" id="sheen"></div>
          <div class="shade" id="coverShade"></div>
        </div>
        <div class="f cover-in" id="coverIn">
          <div class="endpaper"></div>
          <div class="gut-r"></div>
          <div class="warm" id="coverInWarm"></div>
          <div class="shade" id="coverInShade"></div>
        </div>
        <div class="f cover-edge near"></div>
        <div class="f cover-edge fore"></div>
      </div>
    </div>

    <div class="vignette" id="vignette"></div>
    <div class="dim" id="dim"></div>

    <div class="hero" id="hero" aria-live="polite">
      <div class="hshadow" id="heroShadow"></div>
      <div class="sheet paper" id="heroSheet">
        <div class="hrule"></div>
        <div class="lines"></div>
        <div class="gut-l" id="heroGutter"></div>
        <div class="pglow r" id="heroGlow"></div>
      </div>
      <div class="content" id="heroContent">
        <header>
          <div class="eyebrow">
            <svg viewBox="0 0 40 40" aria-hidden="true"><defs><mask id="moonCut2"><rect width="40" height="40" fill="#fff" /><circle cx="24.6" cy="16.6" r="10.2" fill="#000" /></mask></defs><circle cx="20" cy="21" r="12" fill="#c4943f" mask="url(#moonCut2)" /></svg>
            Diary
          </div>
          <h1 class="date" id="dateLabel">2026년 10월 8일 <span>(목)</span></h1>
        </header>
        <textarea id="entry" placeholder="오늘 하루를 적어 보세요" aria-label="일기 내용"></textarea>
      </div>
    </div>
  </div>

  <div class="grade" id="grade"></div>
  <canvas class="fx fx-glow" id="glowCanvas"></canvas>
  <canvas class="fx fx-spark" id="sparkCanvas"></canvas>
  <div class="veil" id="veil"></div>

  <button class="ctrl" id="soundBtn" type="button" aria-pressed="true" aria-label="효과음 켜기/끄기" title="효과음">
    <span class="skin dark" id="skinDark"></span>
    <span class="skin light" id="skinLight"></span>

<script>

/* ═══════════════════════════ Leaf schedule (shared with sound) ═══════════════════════════ */
const LEAF = (() => {
  const n = TIMING.leaves, [a, b] = TIMING.riffle;
  const durs = [], w = [];
  for (let i = 0; i < n; i++) {

  }

  for (let i = 1; i < n; i++) cum.push(cum[i - 1] + (w[i - 1] + w[i]) / 2);
  const span = b - a - durs[n - 1];

/* ═══════════════════════════ Sound (procedural WebAudio) ═══════════════════════════ */
function playIntroSound(ctx, opts = {}) {

  { const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = R() * 2 - 1; }

}

/* ═══════════════════════════ Procedural textures & sprites ═══════════════════════════ */
function makeLeather(size = 192) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), img = g.createImageData(size, size), d = img.data;
  const R = mulberry32(77), n = 26, pts = [];
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) pts.push([0.15 + R() * 0.7, 0.15 + R() * 0.7, R()]);
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = (x / size) * n, v = (y / size) * n, ci = Math.floor(u), cj = Math.floor(v);
    let f1 = 9, f2 = 9, shade = 0;
    for (let dj = -1; dj <= 1; dj++) for (let di = -1; di <= 1; di++) {
      const i = ci + di, j = cj + dj, p = pts[((j + n) % n) * n + ((i + n) % n)];
      const dd = Math.hypot(i + p[0] - u, j + p[1] - v);
      if (dd < f1) { f2 = f1; f1 = dd; shade = p[2]; } else if (dd < f2) f2 = dd;
    }
    const crease = 1 - smooth(clamp01((f2 - f1) * 3.2));
    const fine = R();
    let val = 0.5 + (shade - 0.5) * 0.14 + (fine - 0.5) * 0.14 - crease * 0.3 + (1 - f1) * 0.07;
    const k = (y * size + x) * 4;
    if (val >= 0.5) { d[k] = d[k + 1] = d[k + 2] = 255; d[k + 3] = Math.min(255, (val - 0.5) * 2 * 34); }
    else { d[k] = d[k + 1] = d[k + 2] = 0; d[k + 3] = Math.min(255, (0.5 - val) * 2 * 90); }
  }
  g.putImageData(img, 0, 0);
  return c.toDataURL();
}

let SPR = null;
function makeSprites() {
  const core = cssColor('--light-core'), mid = cssColor('--light-mid'), warm = cssColor('--light-warm');
  const radial = (size, stops) => {
    const c = document.createElement('canvas'); c.width = c.height = size;
    const g = c.getContext('2d'), r = size / 2, gr = g.createRadialGradient(r, r, 0, r, r, r);

  const soft = radial(256, [[0, rgba(mid, 0.9)], [0.3, rgba(mid, 0.45)], [0.62, rgba(warm, 0.12)], [1, rgba(warm, 0)]]);
  const hot = radial(256, [[0, 'rgba(255,255,250,1)'], [0.25, rgba(core, 0.8)], [0.6, rgba(mid, 0.2)], [1, rgba(mid, 0)]]);
  const dot = radial(64, [[0, 'rgba(255,255,248,1)'], [0.09, rgba(core, 1)], [0.2, rgba(mid, 0.55)], [0.45, rgba(warm, 0.14)], [1, rgba(warm, 0)]]);
  const bokeh = radial(128, [[0, rgba(mid, 0.42)], [0.55, rgba(mid, 0.36)], [0.8, rgba(core, 0.3)], [0.9, rgba(mid, 0.12)], [1, rgba(mid, 0)]]);

    const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
    const g = c.getContext('2d'); g.globalCompositeOperation = 'lighter';

      const gr = horizontal ? g.createLinearGradient(0, 0, s, 0) : g.createLinearGradient(0, 0, 0, s);

      if (horizontal) g.fillRect(0, s / 2 - 1.2, s, 2.4); else g.fillRect(s / 2 - 1.2, 0, 2.4, s);
    };

    g.drawImage(dot, s / 2 - 24, s / 2 - 24, 48, 48);
    return c;
  })();

  const ray = (tint) => {
    const w = 64, h = 512, c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data;
    for (let y = 0; y < h; y++) {

  };

/* ═══════════════════════════ Deterministic particle systems ═══════════════════════════ */

    });

      y: R() * 0.95 - 0.05,
      speed: [0.025, 0.055, 0.11][layer] * (0.6 + R() * 0.8),
      sway: (0.004 + R() * 0.012) * (layer + 1), sf: 0.6 + R() * 1.4, ph: R() * 6.28,
      size: layer === 0 ? 3 + R() * 4 : layer === 1 ? 6 + R() * 8 : 26 + R() * 46,

  for (let i = 0; i < COUNTS.stars; i++) stars.push({ x: R(), y: Math.pow(R(), 1.3) * 0.75, s: 1 + R() * 2.2, a: 0.15 + R() * 0.5, f: 0.0015 + R() * 0.004, ph: R() * 6.28 });
  const rays = [];
  for (let i = 0; i < COUNTS.rays; i++) {
    rays.push({
      u: (R() * 2 - 1) * 0.8, v: -0.05 - R() * 0.4, jitter: (R() - 0.5) * 0.22,
      len: 0.75 + R() * 0.55, w: 0.12 + R() * 0.38, a: 0.18 + R() * 0.42,
      t0: TIMING.burst[0] + R() * 380, f: 0.004 + R() * 0.006, ph: R() * 6.28, warm: R() < 0.55,
    });
  }
  return { sparks, leak, ambient, stars, rays };
})();

/* ═══════════════════════════ Layout ═══════════════════════════ */
const G = {};
function layout() {
  const vw = stage.clientWidth, vh = stage.clientHeight;
  const W = Math.round(Math.min(vw * 0.365, vh * 0.335, 312));
  const H = Math.round(W * 1.36);
  const sq = Math.max(3, Math.round(W * 0.03));
  const PW = W - sq, PH = H - 2 * sq;
  const Tb = Math.max(3, +(W * 0.02).toFixed(2));
  const Tp = Math.max(13, Math.round(W * 0.11));
  const persp = Math.round(Math.max(W * 5.2, 800));
  const compact = vw < 700;
  const gap = compact ? 32 : 36, gtop = compact ? 118 : 138;
  const ky = PH / vh; // hero sheet → book page vertical ratio
  Object.assign(G, { vw, vh, W, H, sq, PW, PH, Tb, Tp, persp, cx: vw / 2, cy: vh / 2, unit: W / 170,
    zA: Tb + Tp / 2, dOut: Tb + Tp / 2, dIn: Tp / 2 });
  const s = stage.style;
  const px = (v) => `${v}px`;
  s.setProperty('--W', px(W)); s.setProperty('--H', px(H)); s.setProperty('--PW', px(PW)); s.setProperty('--PH', px(PH));
  s.setProperty('--sq', px(sq)); s.setProperty('--Tb', px(Tb)); s.setProperty('--Tp', px(Tp));
  s.setProperty('--dOut', px(G.dOut)); s.setProperty('--dIn', px(G.dIn)); s.setProperty('--persp', px(persp));
  s.setProperty('--h-gap', px(gap)); s.setProperty('--h-gtop', px(gtop));
  s.setProperty('--p-gap', px(gap * ky)); s.setProperty('--p-gtop', px(gtop * ky)); s.setProperty('--p-rule', `rgba(128, 98, 60, ${(0.26 * Math.min(1, Math.max(0.45, ky * 1.6))).toFixed(3)})`);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  G.sBg = Math.min(dpr, 1.5); G.sGlow = Math.max(0.5, dpr * 0.5); G.sSpark = dpr;
  for (const [k, sc] of [['bg', G.sBg], ['glow', G.sGlow], ['spark', G.sSpark]]) {
    cv[k].width = Math.round(vw * sc); cv[k].height = Math.round(vh * sc);
  }
}

/* ═══════════════════════════ Camera & projection ═══════════════════════════ */
function camera(t) {
  const p = easeInOutCubic(ramp(t, TIMING.camera[0], TIMING.camera[1]));
  const settle = easeOutCubic(ramp(t, 0, 600));
  const drift = smooth(ramp(t, 1100, TIMING.end));
  const s = lerp(CAM.sClosed, CAM.sOpen, p) * lerp(1.04, 1, settle) * (1 + 0.04 * drift);
  return {
    s,
    th: lerp(CAM.thClosed, CAM.thOpen, p) * DEG,
    bx: lerp(-G.W / 2, 0, p) * s,
    by: lerp(CAM.byClosed, CAM.byOpen, p) * G.vh,
  };
}
// book-space point → stage pixel (mirrors the CSS transform chain + perspective)
function project(cam, x, y, z) {
  const c = Math.cos(cam.th), sn = Math.sin(cam.th);
  const X = cam.bx + cam.s * x;
  const Y = cam.by + cam.s * (y * c - z * sn);
  const Z = cam.s * (y * sn + z * c);
  const k = G.persp / (G.persp - Z);
  return { x: G.cx + X * k, y: G.cy + Y * k, k };
}

/* ═══════════════════════════ Scene state at time t ═══════════════════════════ */
function coverAngle(t) {
  const [a, b] = TIMING.cover;
  if (t <= a) return 0;
  if (t < COVER_LAND_MS) return -180 * coverEase(ramp(t, a, COVER_LAND_MS));
  const d = t - COVER_LAND_MS; // small rebound after the impact
  if (d < 130) return -180 + 4.5 * Math.sin(Math.PI * d / 130);
  if (d < 220) return -180 + 1.2 * Math.sin(Math.PI * (d - 130) / 90);
  return -180;
}
const leafState = (i, t) => ramp(t, LEAF.starts[i], LEAF.starts[i] + LEAF.durs[i]); // 0..1 flip progress
function stateAt(t) {
  const cam = camera(t);
  const ca = coverAngle(t);
  const open = clamp01(-ca / 180);
  let moved = 0;
  for (let i = 0; i < LEAF.n; i++) moved += easeInOutCubic(leafState(i, t));
  const rp = moved / LEAF.n;                           // fraction of the riffle that has crossed
  const rf = 1 - 0.55 * rp, lf = 0.55 * rp;            // page block thickness right / left (×Tp)
  const zR = G.Tb + G.Tp * rf, zL = G.Tb + Math.max(0.8, G.Tp * lf);
  const out = 1 - smooth(ramp(t, TIMING.lightOut[0], TIMING.lightOut[1]));
  const burst = smooth(ramp(t, TIMING.burst[0], TIMING.burst[1]));
  const flash = Math.exp(-Math.pow((t - TIMING.flash) / 150, 2));
  const leak = smooth(ramp(open, 0.03, 0.2)) * (1 - smooth(ramp(open, 0.5, 0.95)));
  const surf = Math.max(smooth(ramp(open, 0.3, 0.95)) * 0.6, burst);
  return {
    t, cam, ca, open, rp, rf, lf, zR, zL, zTop: (zR + zL) / 2,
    leak: leak * out, surf: surf * out, rays: burst * out, flash: flash * out, out,
    firstLanded: t >= LEAF.starts[0] + LEAF.durs[0],
  };
}

/* ═══════════════════════════ Render (pure function of t) ═══════════════════════════ */
let REDUCED = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const params = new URLSearchParams(location.search);
if (params.get('reduced') === '1') REDUCED = true;
const END = () => (REDUCED ? REDUCED_DURATION : TIMING.end);

function render(t) {
  if (REDUCED) return renderReduced(t);
  const done = t >= TIMING.end;
  stage.classList.toggle('done', done);
  const S = stateAt(t), cam = S.cam;

  el.veil.style.opacity = (1 - smooth(ramp(t, TIMING.veil[0], TIMING.veil[1]))) * 0.5;
  book.style.transform = `translate3d(${cam.bx}px,${cam.by}px,0) scale3d(${cam.s},${cam.s},${cam.s}) rotateX(${cam.th}rad)`;

  // cover
  cover.style.transform = `translateZ(${G.zA}px) rotateY(${S.ca}deg)`;
  el.coverShade.style.opacity = (0.55 * smooth(clamp01(S.open * 1.9))).toFixed(3);
  el.coverInShade.style.opacity = (0.6 * (1 - smooth(ramp(S.open, 0.5, 1)))).toFixed(3);
  el.coverInWarm.style.opacity = (S.surf * 0.85).toFixed(3);
  el.sheen.style.transform = `translateX(${lerp(-140, 190, easeInOutCubic(ramp(t, 0, 700)))}%) skewX(-22deg)`;
  el.shadowL.style.opacity = smooth(ramp(S.open, 0.86, 1)).toFixed(3);

  // page blocks
  el.pageR.style.transform = `translateZ(${S.zR}px)`;
  el.edgeR.style.transform = `translateZ(${S.zR}px) rotateX(-90deg) scaleY(${S.rf})`;
  el.pageL.style.transform = `translateZ(${S.zL}px)`;
  el.pageL.style.opacity = S.firstLanded ? 1 : 0;
  el.edgeL.style.opacity = S.firstLanded ? 1 : 0;
  el.edgeL.style.transform = `translateZ(${S.zL}px) rotateX(-90deg) scaleY(${Math.max(0.001, (S.zL - G.Tb) / G.Tp)})`;
  el.pageRGlow.style.opacity = (S.surf * 0.9 + S.flash * 0.3).toFixed(3);
  el.pageLGlow.style.opacity = (S.surf * 0.9 + S.flash * 0.3).toFixed(3);
  el.floorGlow.style.opacity = Math.min(1, S.surf * 0.85 + S.leak * 0.35 + S.flash * 0.2).toFixed(3);

  // leaves
  for (let i = 0; i < LEAF.n; i++) {
    const L = leaves[i], p = leafState(i, t);
    const vis = p > 0 && p < 1;
    L.el.style.visibility = vis ? 'visible' : 'hidden';
    if (!vis) continue;
    const e = easeInOutCubic(p);
    const lead = 0.42 * Math.sin(Math.PI * p);
    const z = lerp(S.zR, S.zL, e) + 0.4 + i * 0.05 + Math.sin(Math.PI * p) * G.Tp * 0.12;
    let prev = 0;
    for (let s = 0; s < LEAF_SEGS; s++) {
      const pos = (s + 0.5) / LEAF_SEGS;
      const abs = -180 * clamp01(e + lead * (Math.pow(pos, 1.25) - 0.3));
      L.segs[s].style.transform = s === 0 ? `translateZ(${z}px) rotateY(${abs}deg)` : `rotateY(${abs - prev}deg)`;
      prev = abs;
      const up = Math.abs(Math.sin(abs * DEG));
      L.lits[s].style.opacity = (Math.max(S.surf, 0.35) * (0.35 + 0.65 * up)).toFixed(3);
    }
  }

  // hero sheet: lifts off the right page, rotates to face the viewer and fills the stage
  const lp = ramp(t, TIMING.lift[0], TIMING.lift[1]);
  if (t >= TIMING.lift[0]) {
    el.hero.style.visibility = 'visible';
    el.hero.style.opacity = smooth(ramp(t, TIMING.lift[0], TIMING.lift[0] + 70)).toFixed(3);
    if (done) {
      el.hero.style.transform = 'none';
    } else {
      const e = liftEase(lp), er = easeInOutCubic(clamp01(lp * 1.12));
      const c = Math.cos(cam.th), sn = Math.sin(cam.th);
      const ax = cam.bx + cam.s * (G.PW / 2), ay = cam.by - cam.s * S.zR * sn, az = cam.s * S.zR * c;
      const asx = (G.PW * cam.s) / G.vw, asy = (G.PH * cam.s) / G.vh;
      const bump = Math.sin(Math.PI * e) * G.persp * 0.07;
      const x = lerp(ax, 0, e), y = lerp(ay, 0, e), z = lerp(az, 0, e) + bump;
      const th = lerp(cam.th, 0, er) - Math.sin(Math.PI * er) * 7 * DEG;
      const sx = Math.exp(lerp(Math.log(asx), 0, e)), sy = Math.exp(lerp(Math.log(asy), 0, e));
      el.hero.style.transform = `translate3d(${x}px,${y}px,${z}px) rotateX(${th}rad) scale3d(${sx},${sy},1)`;
    }
    el.heroShadow.style.opacity = (Math.sin(Math.PI * clamp01(lp * 1.05)) * 0.9).toFixed(3);
    el.heroGutter.style.opacity = (1 - smooth(ramp(lp, 0, 0.5))).toFixed(3);
    el.heroGlow.style.opacity = (S.surf * 0.9 + S.flash * 0.3).toFixed(3);
  } else {
    el.hero.style.visibility = 'hidden';
  }
  const tp = easeOutCubic(ramp(t, TIMING.text[0], TIMING.text[1]));
  el.heroContent.style.opacity = tp.toFixed(3);
  el.heroContent.style.transform = tp < 1 ? `translateY(${(1 - tp) * 8}px)` : 'none';
  el.dim.style.opacity = (0.6 * smooth(lp)).toFixed(3);
  el.grade.style.opacity = Math.min(1, S.rays * 0.85 + S.leak * 0.25).toFixed(3);

  const paperness = smooth(ramp(lp, 0.55, 0.95));
  el.skinDark.style.opacity = (1 - paperness).toFixed(3);
  el.skinLight.style.opacity = paperness.toFixed(3);

  if (done) { clearCanvases(); return; }
  drawFX(S);
}

function renderReduced(t) {
  const p = smooth(ramp(t, 0, REDUCED_DURATION));
  const done = t >= REDUCED_DURATION;
  stage.classList.toggle('done', done);
  el.veil.style.opacity = 0;
  book.style.visibility = 'hidden';
  el.vignette.style.opacity = 1 - p;
  el.hero.style.visibility = 'visible';
  el.hero.style.opacity = p.toFixed(3);
  el.hero.style.transform = 'none';
  el.heroGutter.style.opacity = 0; el.heroGlow.style.opacity = 0; el.heroShadow.style.opacity = 0;
  el.heroContent.style.opacity = p.toFixed(3); el.heroContent.style.transform = 'none';
  el.skinDark.style.opacity = (1 - p).toFixed(3); el.skinLight.style.opacity = p.toFixed(3);
  clearCanvases();
}

function clearCanvases() {
  for (const k of ['bg', 'glow', 'spark']) { cx[k].setTransform(1, 0, 0, 1, 0, 0); cx[k].clearRect(0, 0, cv[k].width, cv[k].height); }
}

/* ═══════════════════════════ Canvas FX ═══════════════════════════ */
function sprite(g, img, x, y, w, h, a) {
  if (a <= 0.003 || w < 0.3) return;
  g.globalAlpha = a > 1 ? 1 : a;
  g.drawImage(img, x - w / 2, y - h / 2, w, h);
}

function drawFX(S) {
  // keep the grade centred on the spread
  { const c = project(S.cam, 0, 0, S.zTop); el.grade.style.setProperty('--grade-y', `${(c.y / G.vh * 100).toFixed(1)}%`); }
  const { vw, vh, W, PW, PH, unit } = G;
  const t = S.t, cam = S.cam, P3 = (x, y, z) => project(cam, x, y, z);
  const cosT = Math.cos(cam.th);
  const center = P3(0, -0.05 * PH, S.zTop);
  const amb = smooth(ramp(t, 760, 1250)) * S.out;

  /* ── background canvas: stars, far bokeh, back bloom (all occluded by the book) ── */
  const b = cx.bg;
  b.setTransform(G.sBg, 0, 0, G.sBg, 0, 0); b.clearRect(0, 0, vw, vh);
  b.globalCompositeOperation = 'lighter';
  for (const s of PART.stars) {
    const a = s.a * (0.6 + 0.4 * Math.sin(t * s.f + s.ph)) * (1 - 0.4 * S.rays);
    sprite(b, SPR.star, s.x * vw, s.y * vh, s.s * 2.4, s.s * 2.4, a);
  }
  const bloomA = Math.max(S.surf, S.leak * 0.4) * 0.75 + S.flash * 0.2;
  if (bloomA > 0.005) {
    const c = P3(0, -0.25 * G.H, 0);
    sprite(b, SPR.soft, c.x, c.y, W * 5.2 * cam.s * c.k, W * 3.1 * cam.s * c.k, bloomA * 0.55);
    sprite(b, SPR.glow, c.x, c.y - W * 0.2, W * 2.6 * cam.s * c.k, W * 1.6 * cam.s * c.k, bloomA * 0.35);
  }
  drawAmbient(b, t, amb, center, 0);

  /* ── glow canvas (half-res, screen-blended): leak, page emission, shafts ── */
  const g = cx.glow;
  g.setTransform(G.sGlow, 0, 0, G.sGlow, 0, 0); g.clearRect(0, 0, vw, vh);
  g.globalCompositeOperation = 'lighter';
  if (S.leak > 0.005) {
    const c = P3(PW * 0.99, 0, S.zR + G.Tb);
    sprite(g, SPR.glow, c.x, c.y, W * 0.6 * cam.s * c.k, G.H * 1.1 * cam.s * c.k * cosT, S.leak * 0.9);
    sprite(g, SPR.hot, c.x, c.y, W * 0.14 * cam.s * c.k, G.H * 0.95 * cam.s * c.k * cosT, S.leak * 0.8);
    sprite(g, SPR.soft, c.x + W * 0.2 * cam.s, c.y - W * 0.25 * cam.s, W * 1.3 * cam.s, W * 1.5 * cam.s, S.leak * 0.35);
  }
  if (S.rays > 0.003) {
    // shaft column
    sprite(g, SPR.soft, center.x, center.y - vh * 0.42, PW * 2.0 * cam.s, vh * 1.3, S.rays * 0.33);
    // individual rays radiate from a focal point below the spread
    const focal = { x: center.x, y: center.y + W * 1.1 * cam.s };
    for (const r of PART.rays) {
      const grow = easeOutQuart(ramp(t, r.t0, r.t0 + 420));
      if (grow <= 0) continue;
      const base = P3(r.u * PW, r.v * PH, S.zTop);
      const ang = Math.atan2(base.x - focal.x, focal.y - base.y) * 1.1 + r.jitter;
      const len = vh * r.len * grow * 1.05;
      const wTop = W * r.w * cam.s * 1.35;
      const flick = 0.72 + 0.28 * Math.sin(t * r.f + r.ph);
      const a = r.a * flick * S.rays * (0.6 + 0.4 * grow) + S.flash * 0.12;
      g.save(); g.translate(base.x, base.y); g.rotate(ang);
      g.globalAlpha = Math.min(1, a);
      g.drawImage(r.warm ? SPR.rayWarm : SPR.rayGold, -wTop / 2, -len, wTop, len);
      g.restore();
    }
  }
  if (S.surf > 0.003) {
    const k = center.k;
    sprite(g, SPR.glow, center.x, center.y, PW * 2.25 * cam.s * k, PH * 1.05 * cam.s * k * cosT, S.surf * 0.55 + S.flash * 0.25);
    sprite(g, SPR.hot, center.x, center.y + PH * 0.04 * cam.s * cosT, PW * 1.1 * cam.s * k, PH * 0.7 * cam.s * k * cosT, S.surf * 0.5 + S.flash * 0.35);
    // vertical core rising from the gutter
    sprite(g, SPR.hot, center.x, center.y - PH * 0.25 * cam.s, PW * 0.42 * cam.s * k, PH * 1.1 * cam.s * k, S.rays * 0.38 + S.flash * 0.2);
  }

  /* ── spark canvas (full-res, screen-blended): rising sparkles with depth, near bokeh ── */
  const sp = cx.spark;
  sp.setTransform(G.sSpark, 0, 0, G.sSpark, 0, 0); sp.clearRect(0, 0, vw, vh);
  sp.globalCompositeOperation = 'lighter';
  const fadeAll = 1 - smooth(ramp(t, TIMING.lightOut[0] + 150, TIMING.end - 40));
  // leak sparks (fore-edge gap)
  for (const p of PART.leak) {
    const age = (t - p.t0) / 1000;
    if (age < 0 || age > p.life) continue;
    const q = age / p.life;
    const pos = P3(PW * (0.98 + p.vx * age), p.v * PH, S.zR + G.Tb + W * p.vz * age);
    const a = p.a * smooth(clamp01(q * 6)) * (1 - smooth(ramp(q, 0.45, 1))) * (0.7 + 0.3 * Math.sin(t * 0.001 * p.tw + p.ph)) * fadeAll;
    const sz = p.size * unit * pos.k;
    sprite(sp, SPR.dot, pos.x, pos.y, sz, sz, a);
  }
  // main sparks: born on the open pages, rising in book space (true perspective parallax)
  for (const p of PART.sparks) {
    const age = (t - p.t0) / 1000;
    if (age < 0 || age > p.life) continue;
    const q = age / p.life;
    const x = (p.u * PW) + W * (p.vx * age + p.sway * Math.sin(age * p.sf + p.ph));
    const y = p.v * PH + W * p.vy * age;
    const z = S.zTop + W * p.vz * age * (1 + 0.35 * age);
    const pos = P3(x, y, z);
    const tw = 0.6 + 0.4 * Math.sin(t * 0.001 * p.tw + p.ph);
    const a = p.a * smooth(clamp01(q * 7)) * (1 - smooth(ramp(q, 0.4, 1))) * tw * fadeAll * (0.35 + 0.65 * S.out);
    const sz = p.size * unit * pos.k;
    const img = p.kind === 'glint' ? SPR.glint : p.kind === 'bokeh' ? SPR.bokeh : SPR.dot;
    sprite(sp, img, pos.x, pos.y, sz, sz, p.kind === 'bokeh' ? a * 0.8 : a);
  }
  drawAmbient(sp, t, amb * fadeAll, center, 1);
  drawAmbient(sp, t, amb * fadeAll, center, 2);
}

// screen-space depth layers of floating dust/bokeh around the light column
function drawAmbient(g, t, amb, center, layer) {
  if (amb <= 0.003) return;
  const { vw, vh, unit } = G;
  for (const p of PART.ambient) {
    if (p.layer !== layer) continue;
    const sec = t / 1000;
    let y = p.y - p.speed * sec;
    y = ((y % 1) + 1) % 1;
    const x = p.x + p.sway * Math.sin(sec * p.sf + p.ph);
    const px = x * vw, py = y * vh * 0.92;
    // reveal as a wave expanding from the book
    const dist = Math.hypot((px - center.x) / vw, (py - center.y) / vh);
    const reveal = smooth(ramp(t, TIMING.burst[0] + dist * 700, TIMING.burst[0] + dist * 700 + 350));
    const column = Math.exp(-Math.pow((px - center.x) / (vw * (layer === 2 ? 0.5 : 0.32)), 2));
    const below = py > center.y + 30 ? (layer === 2 ? 0.08 : 0.3) : 1;
    const tw = 0.55 + 0.45 * Math.sin(t * 0.001 * p.tw * 3 + p.ph);
    const a = p.a * amb * reveal * (0.25 + 0.75 * column) * below * (layer === 2 ? 1 : tw);
    const sz = p.size * unit * (layer === 2 ? 1.15 : 1);
    sprite(g, layer === 2 ? SPR.bokeh : p.glint ? SPR.glint : SPR.dot, px, py, sz, sz, a);
  }
}

/* ═══════════════════════════ Playback, skip, seek ═══════════════════════════ */
let raf = 0, startAt = 0, seeking = false, finished = false, current = 0;
let audioCtx = null, soundHandle = null;
let soundOn = true;
try { soundOn = localStorage.getItem(SOUND_KEY) !== 'off'; } catch (e) {}
el.soundBtn.setAttribute('aria-pressed', String(soundOn));

function frame(now) {
  current = now - startAt;
  render(current);
  if (current >= END()) { finish(); return; }
  raf = requestAnimationFrame(frame);
}
function start() {
  cancelAnimationFrame(raf);
  seeking = false; finished = false;
  document.documentElement.classList.remove('seeking');
  book.style.visibility = '';
  startSound();
  startAt = performance.now();
  render(0);
  raf = requestAnimationFrame(frame);
}
function finish() {
  cancelAnimationFrame(raf);
  finished = true; current = END();
  render(current);
  // desktop: caret ready to type; touch: don't pop the keyboard uninvited
  if (!seeking && window.matchMedia('(pointer: fine)').matches) { try { el.entry.focus({ preventScroll: true }); } catch (e) {} }
}
function skip() {
  if (finished) return;
  if (soundHandle) soundHandle.stop();
  finish();
}
function startSound() {
  if (soundHandle) { soundHandle.stop(); soundHandle = null; }
  if (!soundOn) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = audioCtx || new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
    soundHandle = playIntroSound(audioCtx, { minimal: REDUCED });
  } catch (e) { soundHandle = null; }
}
window.__seek = (ms) => {
  cancelAnimationFrame(raf);
  seeking = true;
  document.documentElement.classList.add('seeking');
  if (soundHandle) { soundHandle.stop(); soundHandle = null; }
  current = Math.max(0, +ms || 0);
  finished = current >= END();
  render(current);
};
window.__duration = () => END();

stage.addEventListener('pointerdown', (e) => {
  if (e.target.closest('button, textarea')) return;
  if (!finished && !seeking) skip();
});
el.soundBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
el.soundBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  soundOn = !soundOn;
  el.soundBtn.setAttribute('aria-pressed', String(soundOn));
  try { localStorage.setItem(SOUND_KEY, soundOn ? 'on' : 'off'); } catch (err) {}
  if (soundHandle) soundHandle.setMuted(!soundOn);
});
el.replayBtn.addEventListener('click', (e) => { e.stopPropagation(); start(); });
window.addEventListener('resize', () => { layout(); if (finished || seeking) render(current); });

/* ═══════════════════════════ Boot ═══════════════════════════ */
layout();
makeSprites();
try { $('coverOut').style.setProperty('--leather', `url(${makeLeather()})`); } catch (e) {}
const tParam = params.get('t');
if (tParam !== null) window.__seek(parseFloat(tParam));
else start();
})();
</script>
</body>
</html>
